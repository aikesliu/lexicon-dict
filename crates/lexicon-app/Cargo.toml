[package]
name = "lexicon-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wayland", "x11", "default_fonts", "clipboard"] }
egui = "0.37.0"
image = { version = "0.25.9", default-features = false, features = ["png"] }
lexicon-core = { version = "0.1.0", path = "../lexicon-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[[bin]]
name = "lexicon-dict"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Speech", "Win32_System_Com"] }

[build-dependencies]
winresource = "0.1"
