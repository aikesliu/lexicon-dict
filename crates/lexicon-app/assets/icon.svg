<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="64" y1="20" x2="64" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b8ff0"/>
      <stop offset="0.45" stop-color="#1f6fd0"/>
      <stop offset="1" stop-color="#123e79"/>
    </linearGradient>
    <linearGradient id="coverEdge" x1="64" y1="20" x2="64" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#78b6ff" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#2f80e0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a2b58" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pages" x1="64" y1="30" x2="64" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.62" stop-color="#f4efe4"/>
      <stop offset="1" stop-color="#ddd5c5"/>
    </linearGradient>
    <linearGradient id="pageShade" x1="64" y1="30" x2="64" y2="99" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="64" y1="29" x2="72" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.45" stop-color="#e93b3b"/>
      <stop offset="1" stop-color="#a51d2d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- 书在桌面上的柔和投影 -->
  <ellipse cx="64" cy="109" rx="42" ry="6.5" fill="#0b1f38" opacity="0.26" filter="url(#shadow)"/>

  <!-- 深蓝书壳，中间留出书脊 -->
  <path d="M64 28.5
           C50 20.5 33 18.5 16.5 25.5
           C14.5 26.3 13 28.2 13 30.5
           L13 88.5
           C13 92.8 16.3 95.7 20.4 94.7
           C34.8 91.1 50.3 94.1 62.2 102.1
           C63.4 102.9 64.6 102.9 65.8 102.1
           C77.7 94.1 93.2 91.1 107.6 94.7
           C111.7 95.7 115 92.8 115 88.5
           L115 30.5
           C115 28.2 113.5 26.3 111.5 25.5
           C95 18.5 78 20.5 64 28.5 Z"
        fill="url(#cover)" stroke="#0c2d57" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M64 28.5 C50 20.5 33 18.5 16.5 25.5 C14.5 26.3 13 28.2 13 30.5 L13 34 C28 28 47 30 64 38 C81 30 100 28 115 34 L115 30.5 C115 28.2 113.5 26.3 111.5 25.5 C95 18.5 78 20.5 64 28.5 Z"
        fill="url(#coverEdge)" opacity="0.75" filter="url(#soft)"/>

  <!-- 左右书页 -->
  <path d="M62.5 33.8
           C50.5 27.8 35 26 20.5 30.8
           C19.3 31.2 18.5 32.3 18.5 33.6
           L18.5 85.2
           C18.5 87.3 20.4 88.9 22.5 88.5
           C37 85.5 51 88.5 62.5 95.8 Z"
        fill="url(#pages)" stroke="#b9ae99" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M65.5 33.8
           C77.5 27.8 93 26 107.5 30.8
           C108.7 31.2 109.5 32.3 109.5 33.6
           L109.5 85.2
           C109.5 87.3 107.6 88.9 105.5 88.5
           C91 85.5 77 88.5 65.5 95.8 Z"
        fill="url(#pages)" stroke="#b9ae99" stroke-width="0.9" stroke-linejoin="round"/>

  <!-- 书页高光与厚度 -->
  <path d="M62.5 33.8 C50.5 27.8 35 26 20.5 30.8 C19.3 31.2 18.5 32.3 18.5 33.6 L18.5 38.5 C33 33.5 49 35.5 62.5 42 Z" fill="url(#pageShade)" opacity="0.75"/>
  <path d="M65.5 33.8 C77.5 27.8 93 26 107.5 30.8 C108.7 31.2 109.5 32.3 109.5 33.6 L109.5 38.5 C95 33.5 79 35.5 65.5 42 Z" fill="url(#pageShade)" opacity="0.75"/>
  <path d="M20 87.5 C35 84.5 49 87 62.5 94.5 L62.5 97.5 C49 90.5 35 88.5 20 91 Z" fill="#c9bda7" opacity="0.55"/>
  <path d="M108 87.5 C93 84.5 79 87 65.5 94.5 L65.5 97.5 C79 90.5 93 88.5 108 91 Z" fill="#c9bda7" opacity="0.55"/>

  <!-- 靠近书脊的柔和内阴影，让摊开的书页有厚度 -->
  <path d="M52 31.8 C56 33.4 60 35 62.5 36.2 L62.5 95.2 C56 91.4 52 89.4 46 88.2 Z"
        fill="#8d7f69" opacity="0.16" filter="url(#soft)"/>
  <path d="M76 31.8 C72 33.4 68 35 65.5 36.2 L65.5 95.2 C72 91.4 76 89.4 82 88.2 Z"
        fill="#8d7f69" opacity="0.16" filter="url(#soft)"/>

  <!-- 书脊 -->
  <path d="M64 31.5 L64 99" stroke="#092648" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M64 32 L64 98" stroke="#2d6fbf" stroke-width="1.1" stroke-linecap="round" opacity="0.8"/>

  <!-- 页面上的词条细线 -->
  <g fill="none" stroke="#b9ad97" stroke-width="1.15" stroke-linecap="round" opacity="0.8">
    <path d="M27 41.5 C38 38.8 49 40.2 57.5 43.2"/>
    <path d="M26.5 50.5 C37.5 47.8 49 49.4 57.5 52.6"/>
    <path d="M26 59.5 C37 56.8 48.5 58.6 57.5 61.8"/>
    <path d="M25.5 68.5 C36.5 66 48 67.8 57.5 71"/>
    <path d="M25 77.5 C36 75.2 47.5 77 57.5 80.2"/>
    <path d="M70.5 43.2 C79 40.2 90 38.8 101 41.5"/>
    <path d="M70.5 52.6 C79 49.4 90.5 47.8 101.5 50.5"/>
    <path d="M70.5 61.8 C79.5 58.6 91 56.8 102 59.5"/>
    <path d="M70.5 71 C80 67.8 91.5 66 102.5 68.5"/>
    <path d="M70.5 80.2 C80.5 77 92 75.2 103 77.5"/>
  </g>

  <!-- 红色书签 -->
  <path d="M64 29.5 L71.5 29.5 L71.5 84 L67.7 80.2 L64 84 Z" fill="url(#ribbon)" stroke="#8e1b28" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M65.2 31.5 L65.2 78" stroke="#ffb3a9" stroke-width="0.7" stroke-linecap="round" opacity="0.55"/>

  <!-- 书壳顶边的一点点反光 -->
  <path d="M18 27.5 C34 21.8 49 23.2 63 30.2" fill="none" stroke="#9dccff" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
  <path d="M110 27.5 C94 21.8 79 23.2 65 30.2" fill="none" stroke="#9dccff" stroke-width="1.1" stroke-linecap="round" opacity="0.5"/>
</svg>
